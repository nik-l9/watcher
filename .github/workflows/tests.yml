# The suite runs against real datastores rather than mocks, so CI starts real ones. Tenant
# isolation is the property most worth proving here, and a mocked graph would happily "prove" a
# guarantee the real engine does not provide.
#
# Ports match `.env.example` — 5433, 6380, 6381 — because Cortex avoids the defaults: a developer
# machine usually already has Postgres on 5432, and FalkorDB speaks the Redis protocol, so a
# shadowed port surfaces as a baffling `unknown command 'GRAPH.QUERY'` rather than a connection
# error.
name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, set at the top so every job inherits it and a new job cannot silently get
# more. The default for a workflow with no `permissions:` block is broad -- on a public
# repository a compromised step could use `GITHUB_TOKEN` to push, open releases, or comment as
# the repository. Nothing here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
          POSTGRES_DB: cortex
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cortex -d cortex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # No health check: the image carries no shell to run one, so readiness is polled below
      # instead of being declared here and silently passing.
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      # Pinned to a full commit SHA, not a tag. A tag is mutable: in March 2025 the
      # `tj-actions/changed-files` action was compromised by repointing its existing tags at a
      # malicious commit, and every workflow tracking `@v35` executed it on the next run. A SHA
      # cannot be repointed. The comment records which version the SHA is, because a bare SHA is
      # unreadable and that is how pinning gets reverted by someone tidying up.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Full history, because a secret introduced and later deleted is still in the pack and
      # still exploitable. Scanning only the working tree finds the one case that does not
      # matter.
      - name: Scan the whole history for secrets
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.29.0/gitleaks_8.29.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --exit-code 1 .

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A lockfile that has drifted from pyproject.toml is worse than none: `uv sync` would
      # quietly re-resolve and CI would stop testing the versions the lock names.
      - name: Check the lockfile is current
        run: uv lock --check

      # `uv sync` from the lock, plus a .env carrying a freshly generated vault master key,
      # which the credential vault requires before anything can be encrypted or decrypted.
      - name: Set up the environment
        run: make setup

      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:6333/readyz > /dev/null; then
              echo "qdrant ready"; exit 0
            fi
            sleep 2
          done
          echo "qdrant did not become ready"; exit 1

      - name: Lint
        run: make lint

      # `make test-tenancy` is a subset of this, and the isolation gate it names must pass before
      # any real credential is entered. Running the whole suite covers it.
      - name: Test
        run: make test
