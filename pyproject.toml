[project]
# The distribution name, which is not the import name: `import cortex` stays. Set for
# publishing because `cortex` alone is not available on PyPI. Confirm before a first upload --
# after one, the name is effectively permanent.
name = "cortex-gtm-analyst"
version = "0.1.0"
description = "An AI GTM data analyst that investigates rather than reporting numbers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
keywords = ["analytics", "agents", "llm", "gtm", "root-cause-analysis", "grounding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "falkordb>=1.0.9",
    "qdrant-client>=1.12",
    # Upper bound is deliberate. redis 8.1.0 breaks falkordb 1.6.2: its Redis.__init__
    # receives an unexpected `himport_registry` kwarg through redis's own deprecation
    # wrapper, and every graph call fails with a TypeError. Found when `uv add duckdb`
    # re-resolved the lockfile and silently upgraded a package unrelated to the change.
    "redis>=5.2,<8.1",
    "celery>=5.4",
    "cryptography>=43.0",
    "structlog>=24.4",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "google-auth>=2.35",
    # Upper bound is deliberate, like the redis one above. anthropic 1.0.0 moves to `httpx2`
    # and rejects the `httpx.AsyncClient` this code injects for timeouts and limits:
    # "Expected an instance of `httpx2.AsyncClient`". A clean install resolved 1.0.0 and 45
    # tests failed on a tree whose development venv, holding 0.120.2, passed everything.
    # Lifting the bound is a migration, not a version bump.
    "anthropic>=0.69,<1.0",
    "pyyaml>=6.0",
    "duckdb>=1.5.5",
    "pyjwt[crypto]>=2.10",
    "matplotlib>=3.11.1",
    # Parses SQL for `cortex/tools/sqlguard.py`, which is what makes a parameterised query
    # against a warehouse safe to run. Imported at module level and undeclared until now: it
    # happened to be present in one development venv, so the suite passed there and a clean
    # install failed to collect two test modules.
    "sqlglot>=27",
    # Slack Socket Mode's transport, in `cortex/inbound/socket_mode.py`. Reached this tree
    # only as an extra of `uvicorn[standard]`, which means an inbound transport depended on
    # another package's optional extra to exist.
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # Exact, not a range. A formatter decides what "formatted" means, so a range makes that
    # property unstable: 0.16.0 and 0.16.4 disagreed about two files in this tree, which is
    # enough for CI to fail a branch a developer had just formatted. Bump deliberately.
    "ruff==0.16.4",
    "psycopg[binary]>=3.2",
    # `tests/reports/test_schema.py` reads `MaxLen` out of pydantic field metadata to assert
    # a cap. Guaranteed present as a pydantic requirement, declared anyway: a direct import
    # of another package's dependency is a dependency.
    "annotated-types>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/nik-l9/cortex"
Repository = "https://github.com/nik-l9/cortex"
Issues = "https://github.com/nik-l9/cortex/issues"

[project.scripts]
# The entry points an installed copy needs. `cortex-migrate` comes first in practice: the other
# four need a schema, and an install with no repository checked out has no `alembic.ini` to run
# against -- so the migrations ship inside the package and that command points alembic at them.
cortex-migrate = "cortex.db.migrate:main"
cortex-ask = "cortex.ask:main"
cortex-spend = "cortex.spend:main"
cortex-ingest = "cortex.ingest.__main__:main"
cortex-connect = "cortex.connect:main"
cortex-eval = "cortex.eval.__main__:main"

[tool.hatch.build.targets.wheel]
# `services` is packaged so an installed copy can serve the API and run the workers, not only
# drive the CLI. It is a separate top-level package rather than a subpackage because the tests
# and the container images both import it by that name.
packages = ["cortex", "services"]
# Employee contracts are data the package needs at runtime.
artifacts = ["cortex/agents/employees/*.yaml"]

[tool.hatch.build.targets.wheel.force-include]
# Migrations are the only supported way to create the schema, so an installed copy has to carry
# them. `Base.metadata.create_all` would be one line and a second source of truth: nothing
# checks the two against each other, so they would drift silently and the drift would surface as
# a production schema that no migration describes.
"migrations" = "cortex/_migrations"
"alembic.ini" = "cortex/_alembic.ini"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic writes these files. Reformatting generated output means every future
# `alembic revision --autogenerate` produces lint failures on code nobody wrote.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends()/Header() in argument defaults is the FastAPI dependency idiom.
ignore = ["B008"]
